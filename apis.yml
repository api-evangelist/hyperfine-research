name: Hyperfine Research
description: 'Hyperfine, Inc. (Nasdaq: HYPR) is a medical device company that created
  the Swoop Portable MR Imaging System, the first FDA-cleared, AI-powered, portable
  brain MRI. Swoop uses an ultra-low-field (0.064T) magnet — a fraction of the field
  strength of conventional MRI — to deliver diagnostic brain imaging at the point
  of care in hospitals, neurology clinics, ICUs, and pediatric settings without dedicated
  shielded infrastructure. Its Optive AI software applies deep-learning image reconstruction
  to reduce noise and blur. Hyperfine is headquartered in Guilford, Connecticut and
  is backed by GV (Google Ventures). Hyperfine publishes no public developer API,
  SDKs, or documentation surface.'
